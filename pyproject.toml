[project]
name = "syng-bts-tcga-supplement"
version = "0.1.0"
description = "Reproducibility materials for the SyNG-BTS TCGA study"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.14"

# Pinned with == because this repository is a producing record, not a library.
# TODO: confirm these are the versions used for the published runs before release.
dependencies = [
    "syng-bts==3.5.0",
    "h5py>=3.0",
    "pandas>=1.5",
    # Upper bound required: numba (via syng-bts -> umap-learn -> pynndescent) caps
    # numpy at <2.5. Without it, uv backtracks numba to 0.53.1 and llvmlite to
    # 0.36.0, which cannot build on any supported Python.
    "numpy>=1.23,<2.5",
    "matplotlib>=3.6",
    "scipy>=1.10",
]

[tool.uv]
# This project is a set of scripts, not an installable package.
package = false
