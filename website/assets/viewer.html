<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learning curve viewer</title>
  <script>window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
  <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.6.0.min.js" integrity="sha256-QaOVwtVY0T02VaHrr6pnoHLCwayMJp4O5n4YyaE3rJk=" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
    #plot { width: 100%; height: 100%; }
    #plot.error {
      display: flex; align-items: center; justify-content: center;
      color: #b91c1c; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px; text-align: center; box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="plot"></div>
  <script src="viewer.js"></script>
</body>
</html>
